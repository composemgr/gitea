# nginx proxy address - http://172.17.0.1:3001

name: gitea
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: gitea/gitea:latest
    pull_policy: always
    container_name: gitea-app
    restart: always
    logging: *default-logging
    networks:
      - gitea
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:3001:3000"
      - "2222:22"
    environment:
      TZ: ${TZ:-America/New_York}
      GITEA__DEFAULT__APP_NAME: ${APP_ORG_NAME:-Gitea}
      GITEA__server__DOMAIN: ${BASE_HOST_NAME:-$HOSTNAME}
      GITEA__server__ROOT_URL: http://${BASE_HOST_NAME:-$HOSTNAME}:3001
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: 2222
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${DB_CREATE_DATABASE_NAME:-gitea}
      GITEA__database__USER: ${DB_USER_NAME:-gitea}
      GITEA__database__PASSWD: ${DB_USER_PASS:-changeme_db_password}
      GITEA__security__SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      GITEA__security__INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:-changeme_internal_token_min_32_chars}
      GITEA__mailer__ENABLED: "true"
      GITEA__mailer__PROTOCOL: smtp+starttls
      GITEA__mailer__SMTP_ADDR: ${EMAIL_SERVER_HOST:-172.17.0.1}
      GITEA__mailer__SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      GITEA__mailer__USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      GITEA__mailer__PASSWD: ${EMAIL_SERVER_LOGIN_PASS:-}
      GITEA__mailer__FROM: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      CONTAINER_NAME: gitea-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      gitea-db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://gitea-app:3000'
      - 'cloudflare.hostname=gitea.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.gitea-app.entrypoints=http'
      - 'traefik.http.routers.gitea-app-secure.tls=true'
      - 'traefik.http.routers.gitea-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.gitea-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.gitea-app.middlewares=gitea-app-https-redirect'
      - 'traefik.http.routers.gitea-app-secure.entrypoints=https'
      - 'traefik.http.routers.gitea-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.gitea-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.gitea-app-secure.service=gitea-app'
      - 'traefik.http.services.gitea-app.loadbalancer.server.port=3000'

  gitea-db:
    image: postgres:latest
    pull_policy: always
    container_name: gitea-db
    restart: always
    logging: *default-logging
    networks:
      - gitea
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-gitea}
      POSTGRES_USER: ${DB_USER_NAME:-gitea}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: gitea-db
    volumes:
      - ./volumes/data/db/postgres/gitea:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_NAME:-gitea} -d ${DB_CREATE_DATABASE_NAME:-gitea}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  gitea:
    name: gitea
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
